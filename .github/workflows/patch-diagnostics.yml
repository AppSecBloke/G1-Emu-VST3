name: Build patch diagnostic tools

on:
  workflow_dispatch:
    inputs:
      nme_ref:
        description: 'NME commit/ref (use the tested VST3 revision when known)'
        required: true
        default: '94874fc726df80ae2c096e1db22df41afc566c5e'
        type: string

permissions:
  contents: read

jobs:
  diagnostic-tools:
    name: Windows x64 diagnostic bundle (no ROM)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: G1-Emu
      - uses: actions/checkout@v4
        with:
          repository: joelanders/gearmulator-md-mm
          ref: mdmm-v0.1.0-alpha.13
          path: gearmulator-md-mm
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE
      - uses: actions/checkout@v4
        with:
          repository: animatek/Animatek-NME
          ref: ${{ inputs.nme_ref }}
          path: Animatek-NME
          submodules: false

      - name: Configure separate diagnostic build
        run: >
          cmake -B diagnostic-build -S G1-Emu -A x64
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DGEARMULATOR_DIR="${{ github.workspace }}/gearmulator-md-mm"
          -DG1_JUCE_DIR="${{ github.workspace }}/JUCE"
          -DNME_DIR="${{ github.workspace }}/Animatek-NME"
          -DG1_BACKEND=juce -DG1_DSP_TRACE=ON

      - name: Verify corrected DSP overlay
        run: |
          $overlay = 'diagnostic-build/g1-dsp/dsp56kEmu/jitops_alu.cpp'
          if (-not (Test-Path -LiteralPath $overlay -PathType Leaf)) { throw "Missing DSP overlay: $overlay" }
          $source = (Get-Content -LiteralPath $overlay -Raw) -replace "`r`n", "`n"
          if (-not $source.Contains("auto r = decode_JJJ_read_56(JJJ, !D);`n`t`tr.toTemp();`n`t`talu_cmp(D, r64(r.get()), true);")) {
            throw 'The configured DSP overlay does not contain the CMPM accumulator-preservation correction.'
          }
          $dma = Get-Content diagnostic-build/g1-dsp/dsp56kEmu/dma.cpp -Raw
          foreach ($marker in @('g1_dma_trace.h', '"request_enter"', '"enqueue_pre"', '"enqueue_post"')) {
            if (-not $dma.Contains($marker)) { throw "The DMA3 diagnostic overlay is missing $marker" }
          }
          $essiClock = Get-Content diagnostic-build/g1-dsp/dsp56kEmu/esaiclock.cpp -Raw
          foreach ($marker in @('g1_essi_trace.h', '"clock_enter"', '"clock_schedule"', '"clock_immediate"', '"fine_tick_pre"', '"fine_tick_post"', '"fine_rx_pre"', '"fine_rx_post"', '"clock_advance"', '"rx_pre"', '"rx_post"', '"rx_dispatch"')) {
            if (-not $essiClock.Contains($marker)) { throw "The ESSI producer overlay is missing $marker" }
          }
          if (-not (Get-Content diagnostic-build/g1-dsp/dsp56kEmu/esaiclock.h -Raw).Contains('g1TraceFineClock')) {
            throw 'The diagnostic-only ESSI fine-clock accessor is missing.'
          }
          $timeline = Get-Content G1-Emu/g1Lib/g1_essi_trace.h -Raw
          foreach ($marker in @('G1_DSP_ESSI_TIMELINE_FILE', 'G1_DSP_DISPATCH_TRACE_FILE', 'G1_DSP_IRQD_TRACE_FILE', 'G1_DSP_CAUSAL_HOST_TRACE_FILE', 'fine_threshold', 'g1TraceEssiBlock', 'g1TraceDispatchStep', 'g1TraceIrqdEvent', 'g1TraceCausalHost')) {
            if (-not $timeline.Contains($marker)) { throw "The ESSI clock timeline is missing $marker" }
          }
          if (-not (Get-Content G1-Emu/g1Lib/g1dsp.cpp -Raw).Contains('G1_DSP_VECTOR7E_TRACE_FILE')) {
            throw 'The vector-7E memory-state probe is missing.'
          }
          $core = Get-Content diagnostic-build/g1-dsp/dsp56kEmu/dsp.cpp -Raw
          $coreHeader = Get-Content diagnostic-build/g1-dsp/dsp56kEmu/dsp.h -Raw
          foreach ($marker in @('"callback_entry"', '"callback_exit"')) {
            if (-not $coreHeader.Contains($marker)) { throw "The callback boundary overlay is missing $marker" }
          }
          foreach ($marker in @('"interrupt_enqueue_pre"', '"interrupt_enqueue_post"',
                               '"interrupt_accept_pre"', '"interrupt_clear"')) {
            if (-not $core.Contains($marker)) { throw "The interrupt observation overlay is missing $marker" }
          }

      - name: Build tools only
        run: cmake --build diagnostic-build --config Release --parallel --target g1patchtest dspdis g1dspcheck

      - name: Check DSP extensions without a ROM
        run: ctest --test-dir diagnostic-build -C Release -L g1 --output-on-failure

      - name: Assemble portable diagnostic bundle
        run: |
          New-Item -ItemType Directory -Path diagnostic-bundle | Out-Null
          Copy-Item diagnostic-build/tools/patchtest/g1patchtest_artefacts/Release/g1patchtest.exe diagnostic-bundle/
          Copy-Item diagnostic-build/tools/Release/dspdis.exe diagnostic-bundle/
          Copy-Item G1-Emu/tools/patchtest/run-matched.ps1 diagnostic-bundle/
          Copy-Item G1-Emu/tools/patchtest/run-square-trace.ps1 diagnostic-bundle/
          Copy-Item G1-Emu/tools/patchtest/run-square-startup.ps1 diagnostic-bundle/
          Copy-Item G1-Emu/tools/patchtest/run-square-callback.ps1 diagnostic-bundle/
          Copy-Item G1-Emu/SimpleOSC.pch diagnostic-bundle/
          Copy-Item G1-Emu/WobbleVoice-4Voice.pch diagnostic-bundle/
          Copy-Item G1-Emu/WobbleVoice-2Osc-4Voice.pch diagnostic-bundle/
          Copy-Item Animatek-NME/data/modules.xml diagnostic-bundle/
          Copy-Item G1-Emu/docs/patch-diagnostics.md diagnostic-bundle/README.md
          Copy-Item G1-Emu/LICENSE diagnostic-bundle/
          $info = [ordered]@{
            buildId = "CMPM-build8-squarecallback-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            g1 = (git -C G1-Emu rev-parse HEAD)
            gearmulator = (git -C gearmulator-md-mm rev-parse HEAD)
            dsp56300 = (git -C gearmulator-md-mm/source/dsp56300 rev-parse HEAD)
            dspOverlayCmpmSha256 = (Get-FileHash diagnostic-build/g1-dsp/dsp56kEmu/jitops_alu.cpp -Algorithm SHA256).Hash
            dspOverlayCoreSha256 = (Get-FileHash diagnostic-build/g1-dsp/dsp56kEmu/dsp.cpp -Algorithm SHA256).Hash
            dspOverlayCoreHeaderSha256 = (Get-FileHash diagnostic-build/g1-dsp/dsp56kEmu/dsp.h -Algorithm SHA256).Hash
            dspOverlayDmaSha256 = (Get-FileHash diagnostic-build/g1-dsp/dsp56kEmu/dma.cpp -Algorithm SHA256).Hash
            dspOverlayEssiClockSha256 = (Get-FileHash diagnostic-build/g1-dsp/dsp56kEmu/esaiclock.cpp -Algorithm SHA256).Hash
            dspOverlayEssiHeaderSha256 = (Get-FileHash diagnostic-build/g1-dsp/dsp56kEmu/esaiclock.h -Algorithm SHA256).Hash
            mc68k = (git -C gearmulator-md-mm/source/mc68k rev-parse HEAD)
            juce = (git -C JUCE rev-parse HEAD)
            nme = (git -C Animatek-NME rev-parse HEAD)
            submodules = @(git -C gearmulator-md-mm submodule status --recursive)
            configuration = 'Release, x64, static MSVC runtime, CMPM overlay and bounded DSP0 callback/interrupt observation (Square 32 and 1)'
            runnerImage = $env:ImageVersion
            runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            executableSha256 = (Get-FileHash diagnostic-bundle/g1patchtest.exe -Algorithm SHA256).Hash
            cmake = (cmake --version | Select-Object -First 1)
          }
          $info | ConvertTo-Json -Depth 5 | Set-Content diagnostic-bundle/build-info.json -Encoding UTF8

      - name: Verify bundle launch and matched fixture generation
        run: |
          & ./diagnostic-bundle/g1patchtest.exe 2> usage.txt
          if ($LASTEXITCODE -ne 2) { throw 'The diagnostic executable did not reach its usage check.' }
          ./diagnostic-bundle/run-matched.ps1 -PrepareOnly -OutputDirectory "$env:RUNNER_TEMP/patch-preflight"
          # Exercise the documented Windows PowerShell 5.1 -File entry point,
          # leaving BundleDirectory omitted so its script-local default is tested.
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ./diagnostic-bundle/run-matched.ps1 -PrepareOnly -OutputDirectory "$env:RUNNER_TEMP/patch-preflight-ps51"
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 default-path preflight failed.' }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./diagnostic-bundle/run-square-trace.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw "Square trace runner has PowerShell syntax errors: $parseErrors" }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./diagnostic-bundle/run-square-startup.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw "Square startup runner has PowerShell syntax errors: $parseErrors" }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./diagnostic-bundle/run-square-callback.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw "Square callback runner has PowerShell syntax errors: $parseErrors" }
          # The expected usage exit above must not become this step's exit status.
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v4
        with:
          name: G1-patch-diagnostics-CMPM-build8-squarecallback-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-bundle/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: G1-patch-diagnostics-build-logs
          path: |
            diagnostic-build/CMakeFiles/CMakeConfigureLog.yaml
            diagnostic-build/Testing/Temporary/LastTest.log
            usage.txt
          if-no-files-found: ignore
          retention-days: 14
