name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: G1-Emu

      - name: Gearmulator (the DSP and 68k cores)
        uses: actions/checkout@v4
        with:
          repository: joelanders/gearmulator-md-mm
          ref: mdmm-v0.1.0-alpha.13
          path: gearmulator-md-mm
          submodules: recursive

      - name: JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Animatek editor patch sources
        uses: actions/checkout@v4
        with:
          repository: animatek/Animatek-NME
          path: Animatek-NME
          submodules: false

      - name: Configure
        run: >
          cmake -B build -S G1-Emu -DCMAKE_BUILD_TYPE=Release
          -DGEARMULATOR_DIR=${{ github.workspace }}/gearmulator-md-mm
          -DG1_JUCE_DIR=${{ github.workspace }}/JUCE
          -DNME_DIR=${{ github.workspace }}/Animatek-NME
          -DG1_BACKEND=juce

      - name: Build Windows deliverables
        run: >
          cmake --build build --config Release --parallel
          --target g1run g1gui g1vst3_VST3

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/app/Release/g1run.exe package/
          Copy-Item build/app/gui/g1gui_artefacts/Release/G1-Emu.exe package/
          Copy-Item -Recurse build/plugin/g1vst3_artefacts/Release/VST3/G1-Emu.vst3 package/
          Copy-Item G1-Emu/README.md, G1-Emu/LICENSE package/

      - uses: actions/upload-artifact@v4
        with:
          name: G1-Emu-windows-x86_64
          path: package/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: G1-Emu

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the package
        run: |
          mkdir -p release
          (cd artifacts/G1-Emu-windows-x86_64 && zip -r "$GITHUB_WORKSPACE/release/G1-Emu-windows-x86_64.zip" .)
          ls -l release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "G1-Emu $GITHUB_REF_NAME" \
            --notes-file G1-Emu/docs/release-notes.md
